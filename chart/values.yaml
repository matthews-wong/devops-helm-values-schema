replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.27.3-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8080

# Rendered into a ConfigMap, mounted as env vars. Changing a value rolls the pods.
config:
  LOG_LEVEL: info

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  path: /
  initialDelaySeconds: 2
  periodSeconds: 10

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true
