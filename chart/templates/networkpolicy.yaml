{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "echo-service.fullname" . }}
  labels:
    {{- include "echo-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "echo-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
{{- end }}
